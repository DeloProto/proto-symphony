<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toma de pedido POS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
/* Layout: barra de prototipo arriba + lienzo POS 1920×1080 escalado. Colores y formas tomados del Figma "Simphony PDV" (Módulo de caja · Toma de pedido). */
:root{
  color-scheme: dark;
  --page:#141414; --bar:#1b1b1b; --bar-fg:#dcdcdc; --bar-mute:#8a8f94;
  --bg:#1d1d1d; --status:#000000; --deep:#111111;
  --slate:#424951; --slate-hi:#4e5660; --slate-off:#282a2c; --slate-dark:#30363c;
  --sel:#86939f; --sel-fg:#ffffff;
  --brown:#815a44; --brown-hi:#8d6650; --brown-sub:#6b4732; --brown-sub-hi:#77523c;
  --green:#006241; --green-hi:#0a7150; --green-deep:#172b24;
  --red:#8b2919; --red-hi:#9a3524; --err:#c2203a;
  --paper:#ffffff; --ink:#1b1b1b; --line-sel:#d3d7db;
  --modal:#f1f0f1; --field:#fff0c7; --focus:#e8bb43; --teal:#07a889; --navy:#1b1b33;
  --key:#5a5a5a; --key-hi:#666666; --key-fn:#343434;
  --fg:#ffffff;
  --c-gaveta:#7d263d; --c-ger:#dc4f30; --c-cambio:#be8e7a; --c-wifi:#94501c; --c-rw:#987207;
  --cmp:#4c624c; --cmp-hi:#58705a;
  --r:12px;
  --f:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
}
html,body{height:100%}
body{background:var(--page);color:var(--fg);font-family:var(--f);margin:0;overflow:hidden;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* barra del prototipo */
.pbar{flex:0 0 auto;display:flex;align-items:center;gap:16px;background:var(--bar);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid #000;min-height:48px;box-sizing:border-box}
.pbar .name{font-weight:600;font-size:14px;white-space:nowrap}
.pbar .name small{display:block;font-weight:400;font-size:11px;color:var(--bar-mute);letter-spacing:.04em;text-transform:uppercase}
.pbar .hint{flex:1;min-width:0;font-size:13px;color:var(--bar-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar .hint b{color:#7fd3b3;font-weight:600}
.pbtn{background:#2c3035;color:var(--bar-fg);font-size:13px;padding:8px 14px;border-radius:8px;white-space:nowrap}
.pbtn:hover{background:#383d43}
.pbtn.on{background:var(--sel);color:var(--sel-fg)}
@media (max-width:640px){.pbar .hint{display:none}.pbar{justify-content:space-between}}

.wrap{flex:1;position:relative;overflow:hidden;overflow:clip}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden;font-size:20px;user-select:none}

/* drawer de flujos */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);background:#181a1c;border-left:1px solid #000;z-index:20;overflow:auto;padding-block:16px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));box-sizing:border-box;transform:translateX(100%);visibility:hidden;transition:transform .2s ease,visibility 0s .2s}
.drawer.open{transform:none;visibility:visible;transition:transform .2s ease}
.drawer h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--bar-mute);font-weight:600;margin:18px 0 8px}
.drawer h2:first-child{margin-top:0}
.flow{display:block;width:100%;text-align:left;background:#24282c;padding:10px 12px;margin-bottom:6px;border-radius:8px;border-left:4px solid transparent;color:var(--bar-fg)}
.flow:hover{background:#2e3338}
.flow strong{display:block;font-size:14px;font-weight:600}
.flow span{display:block;font-size:12px;color:var(--bar-mute);margin-top:2px;line-height:1.35}
.flow.happy{border-left-color:var(--green)}.flow.alt{border-left-color:var(--sel)}.flow.unhappy{border-left-color:var(--err)}

/* ---- POS ---- */
.status{position:absolute;left:0;right:0;top:0;height:24px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-size:15px;color:#fff;background:linear-gradient(90deg,var(--status) 0 958px,var(--bg) 958px 964px,var(--status) 964px)}
.t{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;border-radius:var(--r);transition:background .08s}
.b{background:var(--slate)} .b:hover{background:var(--slate-hi)}
.o{background:var(--brown)} .o:hover{background:var(--brown-hi)}
.sb{background:var(--brown-sub)} .sb:hover{background:var(--brown-sub-hi)}
.s,.s:hover{background:var(--sel);color:var(--sel-fg)}
.tab{background:var(--green)} .tab:hover{background:var(--green-hi)}
.tab-on,.tab-on:hover{background:transparent;color:#fff}
.chk{display:inline-block;width:20px;height:20px;margin-right:8px;vertical-align:-3px}
.g{background:var(--green)} .g:hover{background:var(--green-hi)}
.r{background:var(--red)} .r:hover{background:var(--red-hi)}
.ic{width:28px;height:28px}

.ticket{position:absolute;left:0;top:146px;width:388px;height:650px;background:var(--paper);color:var(--ink);overflow:hidden}
.tscroll{height:100%;overflow-y:auto;scrollbar-width:none}
.tscroll::-webkit-scrollbar{display:none}
.ln{display:flex;font-size:17px;padding:2px 12px;line-height:23px;cursor:pointer}
.ln .q{width:24px;flex:0 0 24px}
.ln .n{flex:1;min-width:0}
.ln .p{font-variant-numeric:tabular-nums}
.ln:first-child{padding-top:9px}
.it.sel .ln{background:var(--line-sel)}
.tarrows{position:absolute;left:388px;top:146px;width:44px;height:650px;display:flex;flex-direction:column;justify-content:space-around;align-items:center;background:var(--deep)}
.tarrows button{background:none;width:44px;height:60px;color:#e6e9e6}
.tot{position:absolute;left:6px;top:806px;width:420px;font-size:17px;font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between;line-height:26px;gap:6px}
.tot div:not(.big) span:first-child{flex:1;display:flex;align-items:flex-end;gap:6px}
.tot div:not(.big) span:first-child::after{content:"";flex:1;border-bottom:1.5px dashed #6f6f6f;margin-bottom:7px}
.tot .big{justify-content:flex-end;gap:8px;font-size:21px;margin-top:4px}

.stepcol{position:absolute;left:432px;top:24px;width:216px;height:1056px;background:var(--slate)}
.steps{position:absolute;left:20px;top:80px;width:176px}
.stp{position:relative;left:0;width:176px;height:120px;margin-bottom:8px;background:var(--bg);font-size:20px}
.stp:hover{background:#262626}
.stp.on,.stp.on:hover{background:var(--sel);color:var(--sel-fg)}
.stepmore{position:absolute;left:20px;width:176px;height:22px;background:none;color:#e0e4e8;display:flex;justify-content:center;align-items:center}
.perso{position:absolute;left:0;width:216px;top:790px;text-align:center;font-size:20px}
.toggle{margin:12px auto 0;width:144px;height:56px;border-radius:28px;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:0 10px;box-sizing:border-box}
.toggle span{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.toggle .x{background:var(--red)} .toggle .v{background:var(--green-deep);color:#2a5a48}
.toggle.on .x{background:#3a1d18;color:#7a3a2e} .toggle.on .v{background:var(--green);color:#fff}

.cat{top:24px;height:72px;width:150px;font-size:20px;border-radius:0 0 var(--r) var(--r)}
.dine{border-radius:0 0 var(--r) var(--r)}
.grid{position:absolute;left:664px;width:1240px;display:grid;grid-template-columns:repeat(4,304px);gap:8px;grid-auto-rows:88px}
.grid > button{position:static;font-size:20px;padding:0 10px}
.qtyc{position:absolute;left:664px;top:120px;width:76px;display:grid;grid-auto-rows:66px;gap:0}
.qtyc .disp{background:var(--field);color:var(--ink);height:62px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:6px;border-radius:var(--r)}
.qtyc button{background:var(--slate);border-bottom:2px solid var(--bg);font-size:20px}
.qtyc button:first-of-type{border-radius:var(--r) var(--r) 0 0}
.qtyc button:last-of-type{border-radius:0 0 var(--r) var(--r);border-bottom:0}
.qtyc button.on{background:var(--sel);color:var(--sel-fg)}
.question{position:absolute;left:664px;width:1240px;top:128px;text-align:center;font-size:32px}

/* buscar */
.list-h{position:absolute;left:708px;top:184px;width:620px;height:42px;background:#000;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:20px}
.skuin{position:absolute;left:708px;top:244px;width:538px;height:72px;background:var(--field);color:var(--ink);font-size:32px;display:flex;align-items:center;padding:0 16px;box-sizing:border-box;border:2px solid var(--focus);border-radius:var(--r)}
.skuin.err{border-color:var(--err)}
.skuerr{position:absolute;left:708px;top:322px;width:620px;text-align:right;font-size:16px;color:#ff8f98}
.skulist{position:absolute;left:708px;width:576px;background:#fff;color:var(--ink);overflow:auto;border-radius:var(--r) 0 0 var(--r)}
.skulist .row{display:flex;gap:30px;font-size:19px;padding:3px 12px;cursor:pointer}
.skulist .row.on{background:var(--line-sel)}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.empty b{font-size:20px}.empty span{font-size:15px;color:#555}
.skuarr{position:absolute;left:1284px;width:44px;background:var(--slate);color:#fff}
.skuarr.up{border-radius:0 var(--r) 0 0}.skuarr.dn{border-radius:0 0 var(--r) 0}
.pad{position:absolute;left:1392px;top:184px;display:grid;grid-template-columns:repeat(3,148px);grid-auto-rows:148px;gap:12px}
.pad button{font-size:30px;font-weight:300;border-radius:var(--r)}

/* pantallas completas */
.big-title{position:absolute;left:0;right:0;text-align:center;font-weight:400}
.secth{position:absolute;top:238px;height:40px;background:#000;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:20px}
.tile{flex-direction:column;gap:28px;font-size:20px}
.tile svg{width:72px;height:72px}

/* nombre */
.kb-title{position:absolute;left:280px;top:262px;font-size:32px}
.kb-in{position:absolute;left:280px;top:320px;width:1360px;height:72px;background:var(--field);color:var(--ink);font-size:30px;display:flex;align-items:center;padding:0 16px;box-sizing:border-box;border-radius:var(--r)}
.kb-in i{display:inline-block;width:2px;height:34px;background:var(--ink);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.kb{position:absolute;left:280px;top:430px;width:1360px}
.kr{display:flex;gap:16px;margin-bottom:14px}
.kr button{height:86px;background:var(--key);font-size:32px;font-weight:300;flex:0 0 94px;border-radius:8px}
.kr button:hover{background:var(--key-hi)}
.kr button.fn{background:var(--key-fn);font-size:20px;font-weight:400;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 10px 14px}
.kr button.fn.l{justify-content:flex-start}
.kbok{width:142px;height:186px;font-size:26px;border-radius:8px}

/* modales */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:5}
.modal{z-index:6;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--modal);color:var(--ink);padding:32px;box-sizing:border-box;text-align:center;border-radius:var(--r)}
.modal h3{font-weight:400;font-size:28px;margin:6px 0 24px;line-height:1.25}
.modal .mb{position:static;display:flex;align-items:center;justify-content:center;width:100%;height:84px;font-size:20px;color:#fff;margin-top:20px;border-radius:var(--r)}
.modal .row2{display:flex;gap:24px}
.modal .row2 .mb{flex:1}
.mb.off{background:#c7c4c4;color:#f6f6f6;cursor:default}
.mb.off.red{background:#d9a49b}
.mtext{font-size:20px;line-height:1.4;margin:16px 0 0}
.mtext b{font-weight:600}
.mtext.err{color:var(--err)}
.demo{margin-top:18px;padding-top:14px;border-top:1px dashed #c9c6c6;font-size:15px;color:#666;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.demo button{background:#e2e0e0;color:#333;padding:8px 14px;font-size:15px;border-radius:8px}
.demo button:hover{background:#d6d3d3}
.dlist{border:1px solid #c4c2c2;background:#fff;height:334px;overflow:auto;text-align:left;border-radius:var(--r)}
.dlist .row{display:flex;font-size:20px;padding:12px;cursor:pointer}
.dlist .row .q{width:30px}.dlist .row .n{flex:1}
.dlist .row.on{background:var(--line-sel)}
.reasons{display:flex;gap:12px;height:520px}
.reasons .ls{flex:1;overflow:auto;text-align:left;scrollbar-width:none}
.reasons .ls::-webkit-scrollbar{display:none}
.rsn{display:flex;align-items:center;gap:20px;width:100%;height:64px;background:#fff;color:var(--ink);font-size:19px;padding:0 20px;margin-bottom:12px;border:3px solid transparent;text-align:left;box-sizing:border-box;border-radius:var(--r)}
.rsn.on{border-color:var(--green)}
.rsn .rd{width:22px;height:22px;border-radius:50%;border:2px solid #555;flex:0 0 22px;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.rsn.on .rd{border-color:var(--green)}
.rsn.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--green)}
.rbar{width:56px;background:#dedcdc;display:flex;flex-direction:column;justify-content:space-between;border-radius:var(--r);overflow:hidden}
.rbar button{height:56px;background:var(--slate);color:#fff}
.close{position:absolute;right:20px;top:20px;width:44px;height:44px;background:none;color:var(--ink)}
.pin{height:72px;background:var(--field);border:2px solid var(--focus);font-size:28px;display:flex;align-items:center;padding:0 16px;letter-spacing:4px;border-radius:var(--r)}
.pin.err{border-color:var(--err)}
.pinerr{color:var(--err);font-size:16px;text-align:left;margin-top:8px;min-height:20px}
.mpad{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:80px;gap:10px;margin-top:12px}
.mpad button{background:var(--slate);color:#fff;font-size:24px;font-weight:300;border-radius:var(--r)}
.mpad .r{background:var(--red)} .mpad .g{background:var(--green)}
.fp{width:150px;height:150px;margin:8px auto 0;display:block;background:none}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:#000;color:#fff;font-size:22px;padding:18px 30px;z-index:9;box-shadow:0 8px 30px rgba(0,0,0,.4);white-space:nowrap;border-radius:var(--r)}
.badge{display:inline-block;font-size:13px;background:var(--green);color:#fff;padding:2px 8px;margin-left:8px;vertical-align:3px;border-radius:6px}

/* checkout */
.cmp{background:var(--cmp)} .cmp:hover{background:var(--cmp-hi)}
.amtbox{position:absolute;left:0;top:24px;width:424px;height:72px;background:var(--field);color:var(--ink);font-size:32px;display:flex;align-items:center;padding:0 16px;box-sizing:border-box;border-radius:0 0 var(--r) var(--r);font-variant-numeric:tabular-nums}
.ticket.tall,.tarrows.tall{height:714px}
.tot.tall{top:868px}
.tfoot{border-top:1.5px dashed #b9b9b9;margin:10px 12px 0;padding-top:6px}
.tfoot .ln{padding:2px 0}
.tfoot .ln:first-child{padding-top:2px}
.hdr{position:absolute;left:480px;width:1392px;height:42px;background:#000;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:20px}
.mt{font-size:22px}
.field{height:72px;background:var(--field);border:2px solid var(--focus);font-size:30px;display:flex;align-items:center;padding:0 16px;border-radius:var(--r);color:var(--ink);font-variant-numeric:tabular-nums;box-sizing:border-box;text-align:left}
.field .ph{color:#9a9178;font-size:20px}
.inrow{display:flex;gap:12px}.inrow .field{flex:1;min-width:0}
.trash{width:72px;height:72px;flex:0 0 72px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:#fff}
.trash.off{background:#d9a49b;cursor:default}
.bills{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.bill{height:112px;border-radius:var(--r);color:#fff;font-size:46px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;font-variant-numeric:tabular-nums}
.bill span{font-size:20px;font-weight:500}
.bill::after{content:"";position:absolute;inset:8px;border:2px solid rgba(255,255,255,.35);border-radius:8px;pointer-events:none}
.bill::before{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14)}
.bill10{background:linear-gradient(135deg,#2c7d4e,#56b073)}
.bill20{background:linear-gradient(135deg,#9a5a27,#cf8b4f)}
.bill50{background:linear-gradient(135deg,#a33b56,#d6768d)}
.bill100{background:linear-gradient(135deg,#385d9c,#7393cb)}
.bill200{background:linear-gradient(135deg,#664797,#9b7cc9)}
.bill.other{background:var(--slate);font-size:20px;font-weight:400}
.bill.other::after,.bill.other::before{display:none}
.bill:active{filter:brightness(1.12)}
.due{font-size:16px;color:#555;margin:-14px 0 16px}
.info{background:#fff;border-radius:var(--r);padding:10px 16px;text-align:left;font-size:17px;margin-bottom:14px;font-variant-numeric:tabular-nums}
.info div{display:flex;justify-content:space-between;line-height:30px}
.mpad .wide{grid-column:1/-1}
.card-ic{width:120px;height:96px;margin:4px auto 0;display:block}
.dopts button{display:flex;width:100%;height:76px;margin-bottom:10px;border-radius:var(--r);background:var(--slate);color:#fff;align-items:center;justify-content:center;font-size:19px}
.dopts button:hover{background:var(--slate-hi)}
.chg{font-size:20px;margin:0 0 4px}

/* rewards */
.ov.clear{background:transparent}
.pmenu{position:absolute;left:8px;top:696px;width:336px;background:var(--slate-dark);border-radius:var(--r);padding:10px;box-sizing:border-box;z-index:6;display:grid;gap:8px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.pmenu button{height:84px;border-radius:10px;background:var(--slate);color:#fff;font-size:21px}
.pmenu button:hover{background:var(--green)}
.cust{text-align:center;font-size:17px;line-height:24px;padding:8px 0 6px;border-bottom:1.5px dashed #b9b9b9;margin:0 12px 4px}
.ln.rwl .n,.ln.rwl .p{color:#1d5c46}
.dlg{z-index:6;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:var(--ink);border-radius:16px;padding:34px 36px 30px;box-sizing:border-box;text-align:left;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.dlg h3{font-size:30px;font-weight:600;margin:0 0 6px}
.dlg .sub{font-size:18px;color:#6b6b6b;margin:0 0 26px;line-height:1.4}
.dlg .x{position:absolute;right:26px;top:26px;width:48px;height:48px;background:none;color:var(--ink)}
.dlg .rows{display:grid;gap:12px;max-height:470px;overflow:auto}
.rrow{display:flex;align-items:center;gap:18px;border:1.5px solid #e1e1e1;border-radius:12px;padding:14px 18px;font-size:20px;font-weight:600;background:#fff;width:100%;text-align:left;box-sizing:border-box}
.rrow .ico{width:48px;height:48px;border-radius:10px;background:#f1f1f1;display:flex;align-items:center;justify-content:center;flex:0 0 48px}
.rrow .ico svg{width:26px;height:26px}
.rrow .nm{flex:1;min-width:0}
.rrow .pts{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-weight:500;font-size:20px;white-space:nowrap}
.rrow.na{opacity:.5}.rrow.na .pts{font-family:inherit;font-size:16px}
.rrow.pick{cursor:pointer}.rrow.pick.on{border-color:var(--green);box-shadow:0 0 0 1.5px var(--green) inset}
.dlg .acts{display:flex;justify-content:flex-end;gap:12px;margin-top:26px}
.dlg .acts button{height:64px;min-width:170px;padding:0 24px;border-radius:10px;font-size:21px;font-weight:600}
.btn-out{background:#fff;border:1.5px solid #dcdcdc!important;color:var(--ink)}
.btn-g{background:var(--green);color:#fff}.btn-g.off{background:#a9c3b8;cursor:default}

function rwGroups(ids){
  const all=S.order.items,ix=it=>all.indexOf(it);
  const picked=all.filter(i=>ids.includes(i.id));
  const X=picked.filter(i=>i.canje||i.canjeBy).map(i=>({it:i,why:'Ya canjeado'}));
  const items=picked.filter(i=>!i.canje&&!i.canjeBy);
  const drinks=items.filter(isDrink),used=new Set(),G=[];
  items.filter(i=>i.kind==='food').forEach(f=>{
    let best=null;drinks.forEach(d=>{if(used.has(d.id)||ix(d)>ix(f))return;if(!best||ix(d)>ix(best))best=d});
    if(!best)best=drinks.find(d=>!used.has(d.id));
    if(best){used.add(best.id);used.add(f.id);G.push({ids:[best.id,f.id],at:Math.min(ix(best),ix(f)),label:`${best.name} + ${f.name}`,icon:'cake',stars:200,copay:0,disc:r2(val(best)+val(f))})}
    else X.push({it:f,why:'Solo con una bebida'});
  });
  items.forEach(i=>{if(used.has(i.id))return;
    if(isDrink(i)){const st=i.cat==='drip'?50:100;G.push({ids:[i.id],at:ix(i),label:i.name,icon:'cup',stars:st,copay:0,disc:val(i)})}
    else if(i.kind==='merch'&&PLASTIC.includes(i.name))G.push({ids:[i.id],at:ix(i),label:i.name,icon:'gift',stars:300,copay:15,disc:r2(Math.max(0,val(i)-15))});
    else if(i.kind==='merch'&&METAL.includes(i.name))G.push({ids:[i.id],at:ix(i),label:i.name,icon:'gift',stars:400,copay:45,disc:r2(Math.max(0,val(i)-45))});
    else if(i.kind!=='food')X.push({it:i,why:'No aplica'});
  });
  G.sort((a,b)=>a.at-b.at);return {G,X};
}

    const paged=prods.length>16;const per=paged?14:16;
    const pg=prods.slice(S.page*per,S.page*per+per);
    const showPrice=k==='merch'||k==='simple';
    const cells=pg.map(p=>{const on=it&&it.cat===S.cat&&it.name===p.n&&(k!=='merch');return gb(on?'s':'o',ck(on)+p.n+(showPrice?`<br>S/ ${f2(p.p)}`:''),'prod:'+encodeURIComponent(p.n))});
    if(paged){while(cells.length<14)cells.push('<span></span>');cells.splice(11,0,gb('b',IC.up,'page:-1'));cells.push(gb('b',IC.down,'page:1'))}
    h+=grid(cells,696);
    return h;
  }
  if(st==='buscar') return buscar();
  if(st==='escanear') return buscar();
  if(!it) return `<div class="question" style="font-size:24px;color:#c9d0c9">Primero elige un producto en Tipo</div>`;
  if(st==='adicionales'){
    const qty=`<div class="qtyc"><div class="disp">${S.qty||''}</div>${['1','2','3','4','5','6','7','8','9','0'].map(n=>`<button class="${S.qty===n?'on':''}" data-a="qty:${n}">${n}</button>`).join('')}</div>`;
    const cells=[`<button class="t ${it.extras.length===0&&it.noExtras?'s':'b'}" data-a="noext">${ck(it.extras.length===0&&it.noExtras)}No adicionales</button>`].concat(OPTS.adicionales.map(([l,p])=>{const e=it.extras.find(x=>x.l===l);return gb(e?'s':'b',ck(!!e)+`${l}<br>S/ ${f2(p)}`,'ext:'+l)}));
    return qty+`<div class="grid" style="left:752px;top:120px;width:1152px;grid-template-columns:repeat(4,282px)">${cells.join('')}</div>`;
  }
  const key=st;
  const opts=key==='envase'&&it.kind==='food'?OPTS.envaseFood:OPTS[key];
  return grid(opts.map(([l,p])=>{const lbl=l.replace('<br>',' ').replace(' - 15% dscto.','');const on=it.mods[key]&&it.mods[key].k===lbl;return gb(on?'s':'b',ck(on)+`<span>${l}${p&&p!=='R'?`<br>S/ ${f2(p)}`:''}</span>`,`mod:${key}:${encodeURIComponent(lbl)}`)}),120);
}

  if(m==='auth'){

    if(S.auth==='huella') return `<div class="modal" style="width:570px">${title}<button class="fp" data-a="fp:ok" aria-label="Lector de huella">${FP(S.fpErr?'#c2203a':'#07a889',S.fpErr?'#c2203a':'#1b1b33')}</button><p class="mtext ${S.fpErr?'err':''}">${S.fpErr?'No pudimos reconocer tu huella.<br>Vuelve a intentarlo o ingresa tu clave.':'<b>Escanea tu huella para confirmar.</b><br>Si no puedes, usa tu clave.'}</p><button class="mb g" data-a="clave">Ingresar clave</button><button class="mb b" data-a="close">${IC.x}<span style="margin-left:10px">Cerrar</span></button><div class="demo">Demo del lector: <button data-a="fp:ok">Huella válida</button><button data-a="fp:bad">Huella no reconocida</button></div></div>`;
    return `<div class="modal" style="width:570px">${title}<div class="pin ${S.pinErr?'err':''}">${'*'.repeat(S.pin.length)||'<span style="color:#aaa;font-size:20px;letter-spacing:0">Ingresa tu clave</span>'}</div><div class="pinerr">${S.pinErr?'Clave incorrecta, por favor vuelve a intentarlo.':''}</div><div class="mpad">${['7','8','9','4','5','6','1','2','3'].map(n=>`<button data-a="pin:${n}">${n}</button>`).join('')}<button class="r" data-a="pindel">Borrar</button><button data-a="pin:0">0</button><button class="g" data-a="pinok">OK</button></div><button class="mb b" data-a="close">${IC.x}<span style="margin-left:10px">Cerrar</span></button><div class="demo">Clave demo: ${PIN}</div></div>`;
  }

  return '';
}

/* ---------- acciones ---------- */
let toastT;
function toast(msg){S.toast=msg;render();clearTimeout(toastT);toastT=setTimeout(()=>{S.toast=null;render()},1900)}
function setCat(id){S.cat=id;S.sub=firstSub(id);S.page=0;S.step='tipo';S.perso=false;S.sku='';S.skuErr=false;S.skuSel=null;S.cross=false;const c=cur();if(c&&!c.done&&c.cat!==id)finishCur(true)}
function finishCur(silent){const c=cur();if(c)c.done=true;S.cur=null;S.sel=[];S.edit=false;S.step='tipo';S.cross=false;S.qty='';S.perso=false;if(!silent){S.sub=firstSub(S.cat);S.page=0}}
function advance(){const c=cur();if(!c||c.done)return;const st=STEPS[c.kind];const i=st.indexOf(S.step);
  if(i<st.length-1)S.step=st[i+1];
  else if(c.kind==='food'){finishCur();toast('Producto listo')}
}
function addItem(it){S.order.items.push(it);S._scrollEnd=true}
function newOrder(second){const chk=S.order.chk+1;S.order={items:[],name:'',dine:'tienda',chk,second,rewards:false,pays:[],disc:null,comp:null,cust:null};S.sel=[];S.ck={panel:'methods',method:null};S.lastAmt=null;S.amt='';S.ref='';S.usd='';S.cur=null;S.edit=false;setCat('drip');S.size='Alto'}

function act(a){
  const [cmd,...rest]=a.split(':');const arg=rest.join(':');
  const it=cur();
  switch(cmd){
  case 'noop':return;
  case 'toast':return toast(arg);
  case 'go':
    if(arg==='nombre'){S.kb=S.order.name;S.shift=!S.order.name;S.num=false}
    S.screen=arg;break;
  case 'start':newOrder(arg==='2');S.screen='pos';S.modal='rewards';break;
  case 'rw':if(arg==='1'){S.modal='rwid';break}S.order.rewards=false;S.modal=null;break;
  case 'rwread':S.modal='profile';break;
  case 'profok':setCust();S.modal=null;S._scrollEnd=false;return toast('Cliente Rewards identificado');
  case 'menu':S.modal=S.modal==='menu'?null:'menu';S.perso=false;break;
  case 'rwmenu':{S.modal=null;const o=S.order;
    if(!o.cust){S.modal='rwid';return toast('Identifica al cliente Rewards para continuar')}
    const ids=selIds();if(!ids.length)return toast('Selecciona en el ticket el producto a canjear');
    if(arg==='canje'){if(!rwGroups(ids).G.length)return toast('Los productos seleccionados no aplican para canje');S.modal='redeem';break}
    if(ids.length>1)return toast('Selecciona un solo producto para aplicar un beneficio');
    const t=o.items.find(i=>i.id===ids[0]);if(t.benef)return toast('Este producto ya tiene un beneficio aplicado');
    if(!benefitsFor(t).length)return toast('Este producto no tiene beneficios disponibles');
    S.bpick=0;S.modal='benef';break}
  case 'bpick':S.bpick=Number(arg);break;
  case 'doCanje':{const o=S.order;const {G}=rwGroups(selIds());const tot=G.reduce((a,g)=>a+g.stars,0);if(!G.length||tot>o.cust.stars)return;
    G.forEach(g=>{const last=o.items.find(i=>i.id===g.ids[g.ids.length-1]);last.canje={stars:g.stars,disc:g.disc,copay:g.copay};g.ids.slice(0,-1).forEach(id=>{o.items.find(i=>i.id===id).canjeBy=last.id})});
    o.cust.stars-=tot;S.sel=[];S.cur=null;S.edit=false;S.modal=null;return toast(`Canje aplicado · ${tot} estrellas`)}
  case 'doBenef':{const o=S.order;const t=o.items.find(i=>i.id===selIds()[0]);const B=benefitsFor(t);const b=B[Math.min(S.bpick||0,B.length-1)];if(!b)return;
    t.benef={k:b.k,label:b.label,disc:b.disc};S.sel=[];S.cur=null;S.edit=false;S.modal=null;return toast('Beneficio aplicado: '+b.label)}
  case 'dine':{const was=S.order.dine;S.order.dine=arg;
    if(arg==='togo'&&was!=='togo'){let n=0;S.order.items.forEach(x=>{if(x.kind==='merch'||x.kind==='simple')return;const m=x.mods.envase;if(!m||m.k!=='Descartable'){x.mods.envase={k:'Descartable',l:'Descartable',p:0};n++}});
      if(n)return toast(n>1?`Envase cambiado a Descartable en ${n} productos`:'Envase cambiado a Descartable')}
    break}
  case 'cat':setCat(arg);break;
  case 'size':S.size=arg;if(it&&isDrink(it))it.size=arg;break;
  case 'sub':S.sub=arg;S.page=0;break;
  case 'page':{const n=(SUBS[S.cat][S.sub]||[]).length,max=Math.ceil(n/14)-1;S.page=Math.min(max,Math.max(0,S.page+Number(arg)));break}
  case 'prod':{
    const name=decodeURIComponent(arg);const p=SUBS[S.cat][S.sub].find(x=>x.n===name);const k=kindOf(S.cat);
    if(k==='merch'||k==='simple'){if(it&&!it.done)finishCur(true);const n=mkItem(S.cat,p.n,p.p,{done:true});addItem(n);S.cur=null;toast('Item agregado');return}
    if(it&&!it.done&&it.cat===S.cat){it.name=p.n;it.base=p.p;if(isDrink(it))it.size=S.size}
    else{if(it&&!it.done)finishCur(true);if(it&&it.done){S.cur=null;S.edit=false}S.sel=[];
      const n=mkItem(S.cat,p.n,p.p,{size:S.size});addItem(n);S.cur=n.id}
    if(!(it&&it.done&&S.edit))advance();
    break}
  case 'mod':{const [key,l]=arg.split(':');const lbl=decodeURIComponent(l);if(!it)return;
    const src=key==='envase'&&it.kind==='food'?OPTS.envaseFood:OPTS[key];const o=src.find(x=>x[0].replace('<br>',' ').replace(' - 15% dscto.','')===lbl);
    it.mods[key]={k:lbl,l:o[1]==='R'?'Reusable -15%':lbl,p:o[1]};
    if(!it.done)advance();else toast('Producto actualizado');break}
  case 'qty':S.qty=S.qty===arg?'':arg;break;
  case 'noext':if(!it)return;it.extras=[];it.noExtras=true;if(!it.done&&isDrink(it)){S.step='cross';S.cross=true}break;
  case 'ext':{if(!it)return;const o=OPTS.adicionales.find(x=>x[0]===arg);const q=Number(S.qty)||1;const e=it.extras.find(x=>x.l===arg);
    if(e&&!S.qty)it.extras=it.extras.filter(x=>x!==e);else if(e)e.q=q;else it.extras.push({l:arg,p:o[1],q});it.noExtras=false;S.qty='';break}
  case 'cross':if(arg!=='no'){const [n,p]=arg.split(':');finishCur();const f=mkItem('alimentos',n,Number(p),{done:true});addItem(f);return toast(n+' agregado al pedido')}finishCur();break;
  case 'next':
    if(it&&!it.done&&isDrink(it)&&!S.cross){S.step='cross';S.cross=true;S.perso=false;break}
    finishCur();break;
  case 'step':{
    if(arg!=='tipo'&&arg!=='buscar'&&arg!=='escanear'&&!it)return toast('Primero elige un producto');
    S.perso=false;S.step=arg;if(arg==='escanear'){S.modal='scan'}if(arg==='buscar'){S.skuErr=false}break}
  case 'stepshift':{const st=STEPS[kindOf(S.cat)];const i=st.indexOf(S.step);const j=Math.min(st.length-1,Math.max(0,i+Number(arg)*1));if(st[j]!=='tipo'&&!it)return;S.step=st[j];break}
  case 'sel':{const id=Number(arg);const t=S.order.items.find(x=>x.id===id);if(!t)return;
    if(t.done&&!S.perso){S.sel=S.sel||[];S.sel=S.sel.includes(id)?S.sel.filter(x=>x!==id):S.sel.concat(id);
      if(S.sel.length!==1){S.cur=null;S.edit=false;S.step='tipo';break}
      const one=S.order.items.find(x=>x.id===S.sel[0]);if(it&&!it.done)finishCur(true);
      S.cur=one.id;S.edit=true;S.cat=one.cat;S.sub=Object.keys(SUBS[one.cat]).find(s=>SUBS[one.cat][s].some(p=>p.n===one.name))||firstSub(one.cat);S.page=0;if(isDrink(one))S.size=one.size;S.step='tipo';break}
    S.sel=[id];
    if(it&&!it.done&&it.id!==id)finishCur(true);
    S.cur=id;S.edit=t.done;S.cat=t.cat;S.sub=Object.keys(SUBS[t.cat]).find(s=>SUBS[t.cat][s].some(p=>p.n===t.name))||firstSub(t.cat);S.page=0;if(isDrink(t))S.size=t.size;if(!S.perso)S.step='tipo';break}
  case 'perso':
    if(!S.perso){if(!it){const last=S.order.items[S.order.items.length-1];if(!last)return toast('Agrega un producto para personalizarlo');S.cur=last.id;S.edit=last.done}S.perso=true;S.pCat='Bebidas';S.pSub='Aditivos';S.qty=''}
    else S.perso=false;break;
  case 'pcat':S.pCat=arg;S.pSub=Object.keys(PERSO[arg])[0];break;
  case 'psub':S.pSub=arg;break;
  case 'popt':{if(!it)return;const l=decodeURIComponent(arg);const e=it.perso.find(p=>p.l===l);if(e&&!S.qty)it.perso=it.perso.filter(p=>p!==e);else if(e)e.q=S.qty;else it.perso.push({l,q:S.qty});S.qty='';break}
  case 'tscroll':{const ts=$st.querySelector('.tscroll');if(!ts)return;if(arg==='top')ts.scrollTop=0;else if(arg==='bot')ts.scrollTop=ts.scrollHeight;else ts.scrollBy({top:Number(arg)*150,behavior:'smooth'});return}
  case 'dup':{const src=it||S.order.items[S.order.items.length-1];if(!src)return toast('No hay productos para duplicar');const c=JSON.parse(JSON.stringify(src));c.id=uid++;c.done=true;delete c.canje;delete c.canjeBy;delete c.benef;addItem(c);return toast('Producto duplicado')}
  case 'openDel':S.del=[];S.modal='del';S.perso=false;break;
  case 'dsel':{const id=Number(arg);S.del=S.del.includes(id)?S.del.filter(x=>x!==id):S.del.concat(id);break}
  case 'doDel':{const n=S.del.length;S.order.items=S.order.items.filter(x=>!S.del.includes(x.id));S.sel=(S.sel||[]).filter(x=>!S.del.includes(x));if(S.del.includes(S.cur)){S.cur=null;S.edit=false;S.step='tipo'}S.modal=null;S.del=[];return toast(n>1?`${n} productos eliminados`:'Producto eliminado')}
  case 'openCancel':S.reason=null;S.modal='reason';S.perso=false;break;
  case 'reason':S.reason=Number(arg);break;
  case 'rscroll':{const l=document.getElementById('rls');if(l)l.scrollBy({top:Number(arg)*200,behavior:'smooth'});return}
  case 'toAuth':S.modal='auth';S.auth='huella';S.fpErr=false;S.pin='';S.pinErr=false;break;
  case 'fp':if(arg==='ok')return cancelled();S.fpErr=true;break;
  case 'clave':S.auth='clave';S.pin='';S.pinErr=false;break;
  case 'pin':if(S.pinErr){S.pin='';S.pinErr=false}if(S.pin.length<8)S.pin+=arg;break;
  case 'pindel':S.pin=S.pin.slice(0,-1);S.pinErr=false;break;
  case 'pinok':if(S.pin===PIN)return cancelled();S.pinErr=true;break;
  case 'close':{const was=S.modal;S.modal=null;if(['bills','amount','usd','rwscan'].includes(was)){S.ck.method=null;S.amt=''}if(was==='scan'&&S.step==='escanear')S.step='buscar';break}
  case 'scanok':{const p=SKU[Math.floor(Math.random()*SKU.length)];addItem(mkItem('merch',p.n,p.p,{done:true}));S.modal=null;S.step='buscar';return toast('Item agregado: '+p.n)}
  case 'd':S.skuErr=false;S.skuSel=null;if(S.sku.length<10)S.sku+=arg;break;
  case 'skudel':S.sku=S.sku.slice(0,-1);S.skuErr=false;S.skuSel=null;break;
  case 'skuclear':S.sku='';S.skuErr=false;S.skuSel=null;break;
  case 'skusel':S.skuSel=arg;break;
  case 'skuscroll':{const l=$st.querySelector('.skulist');if(l)l.scrollBy({top:Number(arg)*120,behavior:'smooth'});return}
  case 'skuok':{const res=SKU.filter(s=>s.sku.startsWith(S.sku));
    const pick=S.skuSel?SKU.find(s=>s.sku===S.skuSel):res.length===1?res[0]:SKU.find(s=>s.sku===S.sku);
    if(!S.sku&&!S.skuSel)return toast('Digita un código o elige un item');
    if(!res.length&&!pick){S.skuErr=true;break}
    if(!pick)return toast('Elige un item de la lista');
    addItem(mkItem('merch',pick.n,pick.p,{done:true}));S.sku='';S.skuSel=null;return toast('Item agregado: '+pick.n)}
  case 'pay':if(!S.order.items.length)return toast('Agrega productos antes de ir a pagar');if(it&&!it.done)finishCur(true);S.perso=false;S.screen='checkout';S.ck={panel:'methods',method:null};break;
  case 'ckback':S.screen='pos';break;
  case 'comp':S.order.comp=COMPS[Number(arg)];break;
  case 'ckpanel':S.ck.panel=arg;S.ck.method=null;break;
  case 'm':S.ck.method=arg;S.amt='';S.ref='';
    if(arg==='soles')S.modal='bills';else if(arg==='pos')S.modal='posinfo';else if(arg==='usd')S.modal='usd';break;
  case 'bill':S.amt=f2((parseFloat(S.amt)||0)+Number(arg));break;
  case 'amtclear':S.amt='';break;
  case 'otro':S.amt='';S.modal='amount';break;
  case 'k':keyIn(S.modal==='posref'?'ref':'amt',arg);break;
  case 'kdel':S.amt=S.amt.slice(0,-1);break;
  case 'payCash':{const v=parseFloat(S.amt);if(!v)return;return addPay('soles',v,'Efectivo')}
  case 'posref':S.ref='';S.modal='posref';break;
  case 'refclear':S.ref='';break;
  case 'payPos':if(!S.ref)return;return addPay('pos',remaining(),'POS · Ref. '+S.ref);
  case 'payUsd':{const u=parseFloat(S.amt);if(!u)return;return addPay('usd',r2(u*FX),`Dólares · US$ ${f2(u)}`,u)}
  case 'sbr':S.ck.method='sbr';if(!S.order.rewards){S.modal='rwscan';break}return addPay('rewards',remaining(),'Starbucks Rewards');
  case 'rwok':if(!S.order.cust)setCust();return addPay('rewards',remaining(),'Starbucks Rewards');
  case 'openDisc':S.modal='disc';break;
  case 'disc':{const d=DISCS[Number(arg)];if(d[2]){S.pendDisc=Number(arg);S.modal='colab';break}S.order.disc={l:d[0],pct:d[1]};S.modal='discok';break}
  case 'colabok':{const d=DISCS[S.pendDisc];S.order.disc={l:d[0],pct:d[1]};S.modal='discok';break}
  case 'ckexit':S.modal=null;S.screen='caja';newOrder(false);break;
  case 'paid':S.modal=null;S.screen='caja';newOrder(false);return toast('Pedido cobrado');
  case 'key':{let c=decodeURIComponent(arg);if(S.shift&&!S.num)c=c.toUpperCase();if(S.kb.length<30)S.kb+=c;if(S.shift&&c.trim())S.shift=false;break}
  case 'kbdel':S.kb=S.kb.slice(0,-1);break;
  case 'kbclear':S.kb='';S.shift=true;break;
  case 'shift':S.shift=!S.shift;break;
  case 'num':S.num=!S.num;break;
  case 'kbok':S.order.name=S.kb.trim();S.screen='pos';break;
  }
  render();
}
function cancelled(){S.modal='success';S.screen='caja';S.order.items=[];S.order.name='';S.order.pays=[];S.order.disc=null;S.order.comp=null;S.lastAmt=null;S.order.cust=null;S.order.rewards=false;S.sel=[];S.cur=null;S.edit=false;S.perso=false;render()}

$st.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;act(b.dataset.a)});
document.addEventListener('keydown',e=>{
  if(S.screen==='nombre'){if(e.key==='Enter')act('kbok');else if(e.key==='Backspace')act('kbdel');else if(e.key.length===1){S.kb+=e.key;render()}return}
  if(['amount','usd','posref'].includes(S.modal)){if(/^[\d.]$/.test(e.key))act('k:'+e.key);else if(e.key==='Backspace')act(S.modal==='posref'?'refclear':'kdel');return}
  if(S.modal==='auth'&&S.auth==='clave'){if(/^\d$/.test(e.key))act('pin:'+e.key);else if(e.key==='Backspace')act('pindel');else if(e.key==='Enter')act('pinok');return}
  if(S.screen==='pos'&&!S.modal&&S.step==='buscar'){if(/^\d$/.test(e.key))act('d:'+e.key);else if(e.key==='Backspace')act('skudel');else if(e.key==='Enter')act('skuok')}
  if(e.key==='Escape'&&S.modal)act('close');
});

/* ---------- escenarios del Figma ---------- */
function latte(done=true,extras=true){return mkItem('espresso','Alg Latte',14,{done,mods:{envase:{k:'Descartable',l:'Descartable',p:0},cafe:{k:'Espresso',l:'Expreso',p:0}},extras:extras?[{l:'Chispas choco',p:1,q:1},{l:'Shot de café',p:1,q:1}]:[]})}
function croissant(){return mkItem('alimentos','Croissant jamón y queso',12.5,{done:true,mods:{temperatura:{k:'Caliente',l:'Caliente',p:0}}})}
function base(){S=fresh();S.screen='pos';S.order.chk=1043}
const D=(k,l)=>({k,l,p:0});
function cafeDia(){return mkItem('drip','Café del día',8.5,{done:true,size:'Grande',mods:{envase:D('Descartable','Descartable'),cafe:D('Espresso','Expreso')}})}
function frapp(n='Caramel Frappuccino',m={}){return mkItem('frappuccino',n,16,{done:true,mods:Object.assign({envase:D('Descartable','Descartable'),cafe:D('Espresso','Expreso')},m)})}
function ciabatta(){return mkItem('alimentos','Chicken Ciabatta',15.5,{done:true,mods:{envase:D('Descartable','Descartable'),temperatura:D('Caliente','Caliente')}})}
const mer=n=>mkItem('merch',n,n==='Tumbler Siren'?59:89,{done:true});
function rw0(...items){base();setCust();items.forEach(addItem)}
function ck0(comp){base();addItem(latte());S.screen='checkout';if(comp)S.order.comp=COMPS[0]}

 ['Alternative paths',[

  ['alt','Merch','Por subcategoría o buscando el item por su código con el teclado numérico.',()=>{base();setCat('merch')},'agrega un item de Destacados o entra a <b>Buscar</b> y digita 11123.'],
  ['alt','Merch con scan','Escaneando el código con el lector, sin digitar el SKU.',()=>{base();setCat('merch')},'toca <b>Escanear</b> y simula la lectura.'],

  ['alt','Personalizar pedido','Con el producto seleccionado, se activa Personalizar y se eligen aditivos, syrups u otras indicaciones.',()=>{base();const l=latte();addItem(l);S.cur=l.id;S.edit=true},'activa el interruptor <b>Personalizar</b> y elige Syrups.'],
  ['alt','Edición de bebida','Editar una bebida que ya está en el ticket.',()=>{base();addItem(latte())},'toca el producto en el ticket, luego <b>Envase</b> → Loza.'],
  ['alt','Borrar un producto','El ticket tiene una bebida y un alimento; se borra solo el alimento.',()=>{base();addItem(latte(true,false));addItem(croissant())},'toca el <b>tacho</b>, marca el croissant y borra.'],
  ['alt','Borrar todos los productos','Se marcan los dos productos y se borran juntos.',()=>{base();addItem(latte(true,false));addItem(croissant())},'toca el <b>tacho</b> y marca ambos productos.'],
  ['alt','Cancelar pedido con clave','Motivo de cancelación y autorización gerencial con clave.',()=>{base();addItem(latte())},'toca <b>Cancelar pedido</b>, elige motivo e ingresa la clave 1234.'],
  ['alt','Cancelar pedido con huella','El gerente autoriza escaneando su huella.',()=>{base();addItem(latte())},'toca <b>Cancelar pedido</b> y simula una huella válida.']]],
 ['Rewards',[
  ['happy','Identificar al cliente','Nuevo pedido → ¿Es cliente Rewards? → escanear tarjeta → perfil del cliente → Confirmar.',()=>{S=fresh();S.screen='inicio'},'toca <b>Nuevo pedido</b> → Sí, cliente Rewards → simula la lectura → Confirmar.'],
  ['happy','Canjear café del día · 50 ★','Producto seleccionado → Más opciones → Recompensas → Canjear.',()=>rw0(cafeDia()),'toca el café en el ticket, luego <b>···</b> → Recompensas → Canjear.'],
  ['happy','Canjear Frappuccino · 100 ★','Canje de 100 estrellas por un Frappuccino del ticket.',()=>rw0(frapp()),'toca el Frappuccino en el ticket, luego <b>···</b> → Recompensas.'],
  ['happy','Canjear bebida + alimento · 200 ★','Se seleccionan una bebida y un alimento y se canjean juntos.',()=>rw0(frapp(),ciabatta()),'toca los <b>dos productos</b> en el ticket, luego <b>···</b> → Recompensas.'],
  ['happy','Canjear tumbler · 300 ★ + S/ 15','Canje de un tumbler de plástico con copago.',()=>rw0(mer('Tumbler Siren')),'toca el tumbler en el ticket, luego <b>···</b> → Recompensas.'],
  ['happy','Canjear merch · 400 ★ + S/ 45','Canje de un tumbler de acero con copago.',()=>rw0(mer('Tumbler Metal')),'toca el tumbler en el ticket, luego <b>···</b> → Recompensas.'],
  ['alt','Canjear varios productos','Se seleccionan varias recompensas a la vez desde un ticket con muchos productos.',()=>rw0(cafeDia(),frapp('Caramel Frappuccino',{crema:D('Con crema batida','Con crema batida')}),frapp('Mocha Frappuccino',{leche:D('Sin Lactosa','Sin Lactosa')}),ciabatta(),mer('Tumbler Siren'),mer('Tumbler Metal'),frapp('Java Chip Frappuccino')),'toca todos menos el último Frappuccino, luego <b>···</b> → Recompensas.'],
  ['happy','Beneficio · Shot gratis','Shot de café gratis en cualquier bebida.',()=>{const a=latte(true,false);a.extras=[{l:'Shot de café',p:1,q:1}];rw0(a)},'toca la bebida, luego <b>···</b> → Beneficios → Shot de café gratis.'],
  ['happy','Beneficio · Cumpleaños','Bebida gratis por cumpleaños, cualquier bebida y tamaño.',()=>rw0(frapp('Caramel Frappuccino',{leche:D('Entera','Entera'),crema:D('Con crema batida','Con crema batida')})),'toca la bebida, luego <b>···</b> → Beneficios.'],
  ['happy','Beneficio · Café en grano','Bebida alta gratis si el cliente compró café en grano.',()=>rw0(latte(true,false)),'toca la bebida alta, luego <b>···</b> → Beneficios → Bebida alta por café en grano.'],
  ['happy','Beneficio · Refill','Solo para café del día y té; el producto queda en 0.',()=>rw0(cafeDia()),'toca el café, luego <b>···</b> → Beneficios → Refill.']]],
 ['Checkout',[
  ['happy','Pago en soles · Otro monto','Comprobante → Soles → Otro monto con el teclado.',()=>{ck0()},'elige <b>Boleta simple</b>, luego <b>Soles</b> → Otro monto e ingresa 50.'],
  ['happy','Pago con billetes','Cada toque en un billete suma su valor: dos toques en S/ 20 dan 40.00.',()=>{ck0()},'elige un comprobante, <b>Soles</b> y toca dos veces S/ 20.'],
  ['happy','Pago con Rewards','Rewards → Starbucks Rewards. Si el cliente no está identificado se pide la tarjeta.',()=>{ck0()},'elige comprobante, <b>Rewards</b> → Starbucks Rewards.'],
  ['happy','Pago con POS','Cobro en el POS → referencia → pago exitoso.',()=>{ck0()},'elige comprobante, <b>POS</b> → Continuar e ingresa la referencia.'],
  ['happy','Pago en dólares','Diálogo con tipo de cambio; se ingresa el monto recibido y se paga.',()=>{ck0()},'elige comprobante, <b>Dólares</b> e ingresa 5.'],
  ['alt','Borrar monto','Se borra el monto ingresado carácter por carácter con Borrar.',()=>{ck0(true);S.ck.method='soles';S.modal='amount';S.amt='50.00'},'toca <b>Borrar</b> hasta dejar el monto vacío.'],
  ['alt','Eliminar monto con billetes','Se elimina todo el monto sumado con la papelera.',()=>{ck0(true);S.ck.method='soles';S.modal='bills';S.amt='40.00'},'toca la <b>papelera</b> junto al monto.'],
  ['alt','Borrar referencia del POS','Se elimina la referencia ingresada con la papelera.',()=>{ck0(true);S.ck.method='pos';S.modal='posref';S.ref='1234'},'toca la <b>papelera</b> junto a la referencia.'],
  ['alt','Descuento gerencial','Descuentos → Dscto. Gerencial 50 % pide la tarjeta del colaborador.',()=>{ck0(true)},'toca <b>Descuentos</b> → Dscto. Gerencial - 50%.']]],
 ['Unhappy paths',[
  ['unhappy','Error SKU','Se digita un SKU de merch que no existe.',()=>{base();setCat('merch');S.step='buscar'},'digita <b>99999</b> y toca OK.'],
  ['unhappy','Error de clave','Clave incorrecta al cancelar la transacción.',()=>{base();addItem(latte())},'cancela el pedido e ingresa una clave distinta de 1234.'],
  ['unhappy','Error de huella','El lector no reconoce la huella al cancelar.',()=>{base();addItem(latte())},'cancela el pedido y simula <b>Huella no reconocida</b>.']]],
];
const dr=document.getElementById('drawer');
dr.innerHTML=FLOWS.map(([g,fs])=>`<h2>${g}</h2>`+fs.map((f,i)=>`<button class="flow ${f[0]}" data-flow="${g}|${i}"><strong>${f[1]}</strong><span>${f[2]}</span></button>`).join('')).join('');
const bf=document.getElementById('btnFlows');
function setDrawer(o){dr.classList.toggle('open',o);bf.classList.toggle('on',o);bf.setAttribute('aria-expanded',o)}
bf.onclick=()=>setDrawer(!dr.classList.contains('open'));
dr.addEventListener('click',e=>{const b=e.target.closest('[data-flow]');if(!b)return;const [g,i]=b.dataset.flow.split('|');const f=FLOWS.find(x=>x[0]===g)[1][i];f[3]();S.hint=`${f[1]} — ${f[4]}`;setDrawer(false);render()});
document.getElementById('btnReset').onclick=()=>{S=fresh();render()};

/* ---------- escala ---------- */
const wrap=document.getElementById('wrap');
function fit(){const w=wrap.clientWidth,h=wrap.clientHeight;const s=Math.min(w/1920,h/1080);$st.style.transform=`translate(${(w-1920*s)/2}px,${(h-1080*s)/2}px) scale(${s})`}
addEventListener('resize',fit);new ResizeObserver(fit).observe(wrap);fit();
setInterval(()=>{if(!S.modal&&S.screen!=='nombre'){const st=$st.querySelector('.status span:last-child');if(st)st.innerHTML=clock()}},20000);
render();
</script>
